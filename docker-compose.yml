services:
  postgres:
    image: postgres:16
    container_name: mierag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mierag
      POSTGRES_PASSWORD: mierag
      POSTGRES_DB: mierag
    ports:
      - "5432:5432"
    volumes:
      - mierag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mierag -d mierag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mierag_pgdata:
